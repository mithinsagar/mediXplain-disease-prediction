name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core requirements
        # Skip the heavy tensorflow dependency for CI - deep models are optional.
        run: |
          python -m pip install --upgrade pip
          grep -v '^tensorflow' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 app ml rag utils tests --max-line-length=100 --extend-ignore=E203,W503

      - name: Format check with black
        run: black --check --line-length=100 app ml rag utils tests

      - name: Run pytest
        run: pytest -q --cov=app --cov=ml --cov=rag --cov=utils --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore
