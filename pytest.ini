[pytest]
# MediXplain pytest configuration
# Author:  Mithin Sagar S
# GitHub:  https://github.com/mithinsagar

minversion = 8.0
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
