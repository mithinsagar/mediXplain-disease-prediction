<?xml version="1.0" encoding="UTF-8"?>
<!--
  MediXplain end-to-end training and inference workflow
  Author:  Mithin Sagar S
  GitHub:  https://github.com/mithinsagar
  Project: MediXplain - Explainable Disease Prediction System
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030A12"/>
      <stop offset="1" stop-color="#112035"/>
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A97A8"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg2)"/>
  <text x="40" y="46" fill="#E4EDF6" font-size="22" font-weight="700">MediXplain — Training and Inference Workflow</text>
  <text x="40" y="70" fill="#8A97A8" font-size="12">Author: Mithin Sagar S · github.com/mithinsagar</text>

  <g font-size="13" fill="#E4EDF6">
    <g transform="translate(40,120)">
      <rect width="150" height="60" rx="12" fill="#071018" stroke="#3A8EFD"/>
      <text x="75" y="26" text-anchor="middle" font-weight="700">Kaggle CSV</text>
      <text x="75" y="46" text-anchor="middle" fill="#8A97A8" font-size="11">data/raw/</text>
    </g>
    <g transform="translate(220,120)">
      <rect width="150" height="60" rx="12" fill="#071018" stroke="#3A8EFD"/>
      <text x="75" y="26" text-anchor="middle" font-weight="700">prepare_dataset</text>
      <text x="75" y="46" text-anchor="middle" fill="#8A97A8" font-size="11">ml.prepare_dataset</text>
    </g>
    <g transform="translate(400,120)">
      <rect width="170" height="60" rx="12" fill="#071018" stroke="#F5C842"/>
      <text x="85" y="26" text-anchor="middle" font-weight="700">train_models</text>
      <text x="85" y="46" text-anchor="middle" fill="#8A97A8" font-size="11">7 sklearn models</text>
    </g>
    <g transform="translate(600,120)">
      <rect width="150" height="60" rx="12" fill="#071018" stroke="#F5C842"/>
      <text x="75" y="26" text-anchor="middle" font-weight="700">best_model.pkl</text>
      <text x="75" y="46" text-anchor="middle" fill="#8A97A8" font-size="11">models/</text>
    </g>
    <g transform="translate(780,120)">
      <rect width="150" height="60" rx="12" fill="#071018" stroke="#2FD6A4"/>
      <text x="75" y="26" text-anchor="middle" font-weight="700">build_faiss_index</text>
      <text x="75" y="46" text-anchor="middle" fill="#8A97A8" font-size="11">rag/</text>
    </g>

    <g transform="translate(40,240)">
      <rect width="150" height="60" rx="12" fill="#0C1928" stroke="#3A8EFD"/>
      <text x="75" y="26" text-anchor="middle" font-weight="700">Symptoms in</text>
      <text x="75" y="46" text-anchor="middle" fill="#8A97A8" font-size="11">web form / API</text>
    </g>
    <g transform="translate(220,240)">
      <rect width="150" height="60" rx="12" fill="#0C1928" stroke="#3A8EFD"/>
      <text x="75" y="26" text-anchor="middle" font-weight="700">DiseasePredictor</text>
      <text x="75" y="46" text-anchor="middle" fill="#8A97A8" font-size="11">app.predictor</text>
    </g>
    <g transform="translate(400,240)">
      <rect width="170" height="60" rx="12" fill="#0C1928" stroke="#F5C842"/>
      <text x="85" y="26" text-anchor="middle" font-weight="700">Top-K prediction</text>
      <text x="85" y="46" text-anchor="middle" fill="#8A97A8" font-size="11">calibrated confidence</text>
    </g>
    <g transform="translate(600,240)">
      <rect width="150" height="60" rx="12" fill="#0C1928" stroke="#2FD6A4"/>
      <text x="75" y="26" text-anchor="middle" font-weight="700">FAISS Retrieval</text>
      <text x="75" y="46" text-anchor="middle" fill="#8A97A8" font-size="11">top paragraph</text>
    </g>
    <g transform="translate(780,240)">
      <rect width="150" height="60" rx="12" fill="#0C1928" stroke="#8B7FFF"/>
      <text x="75" y="26" text-anchor="middle" font-weight="700">Response JSON</text>
      <text x="75" y="46" text-anchor="middle" fill="#8A97A8" font-size="11">prediction + evidence</text>
    </g>
  </g>

  <g stroke="#8A97A8" stroke-width="1.5" fill="none">
    <path d="M190 150 L220 150" marker-end="url(#arrow2)"/>
    <path d="M370 150 L400 150" marker-end="url(#arrow2)"/>
    <path d="M570 150 L600 150" marker-end="url(#arrow2)"/>
    <path d="M750 150 L780 150" marker-end="url(#arrow2)"/>

    <path d="M190 270 L220 270" marker-end="url(#arrow2)"/>
    <path d="M370 270 L400 270" marker-end="url(#arrow2)"/>
    <path d="M570 270 L600 270" marker-end="url(#arrow2)"/>
    <path d="M750 270 L780 270" marker-end="url(#arrow2)"/>
  </g>

  <text x="40" y="380" fill="#8A97A8" font-size="12">Solid arrows = data flow. Top row = one-time training. Bottom row = per-request inference.</text>
</svg>
